apiVersion: v1
kind: Pod
metadata:
  name: parakeet-artifacts
  namespace: parakeet-demo
  labels:
    auto-delete: "no"
    auto-stop: "no"
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  securityContext:
    fsGroup: 1000
  nodeSelector:
    workload: parakeet-training
    kubernetes.io/arch: amd64
  tolerations:
    - key: dedicated
      operator: Equal
      value: parakeet-training
      effect: NoSchedule
  containers:
    - name: artifacts
      image: public.ecr.aws/docker/library/busybox:1.37.0
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: "1"
          memory: 256Mi
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: parakeet-workspace
