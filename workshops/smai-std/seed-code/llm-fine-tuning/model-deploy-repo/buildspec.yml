version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - pip install --upgrade pip boto3

  build:
    commands:
      - export PYTHONUNBUFFERED=TRUE
      - echo "Deploying the latest approved model with GPU capacity fallback..."
      # Tries each type in deploy-config.json in order and moves to the next
      # one on a capacity error. Writes deploy-output.json on success.
      - python deploy_with_fallback.py

artifacts:
  files:
    - deploy-output.json
    - deploy-config.json
