# =============================================================================
# Dataset Schema — VENDORED COPY
# =============================================================================
# This is a vendored copy of the workshop's canonical dataset schema:
#
#     lab5-monitoring/src/config/dataset_schema.yaml
#
# It is duplicated here because this directory is seeded into a SEPARATE GitHub
# repository (the SageMaker Project's model-build repo) and therefore cannot
# import `workshop_common.schema` from the workshop repo.
#
# WHY THIS MATTERS: the feature order below is a POSITIONAL CONTRACT. Lab 2
# writes the Iceberg tables with these columns, this pipeline materializes
# target-first header-less CSVs in this order, and the trained booster knows its
# inputs only by position (f0..f19). A silent skew between this file and the
# canonical one produces a model that predicts confidently on misaligned
# columns — no error, just wrong answers.
#
# SYNC RULE: if you change the canonical file, change this one in the same
# commit. `ml_pipelines/_dataset_schema.py` reads only this file; nothing in this
# repo re-types the feature list.
#
# Supported `type` values: double, string, boolean, int, timestamp.
# =============================================================================
dataset:
  # Unique row identifier. Generated synthetically by Lab 2 ('bm-<split>-<i>').
  identifier_column: client_id

  # Primary event timestamp. Synthetic, generated by Lab 2.
  timestamp_column: contact_timestamp

  # Binary classification target. BOOLEAN in Athena/Iceberg; this pipeline
  # casts it to 0/1 when materializing the training CSVs.
  target_column: subscribed
  target_type: boolean

  # Columns carried in the Iceberg tables for auditability but NEVER passed to
  # the model. Lab 2 writes them NULL; Lab 3/4 inference capture fills them.
  auxiliary_columns:
    - name: prediction
      type: boolean
    - name: probability_positive
      type: double

  # Full feature list, in the order the pipeline expects them. Appending is
  # safe; REORDERING breaks every previously trained model.
  #
  # Bank Marketing (bank-additional-full.csv) features after label-encoding the
  # categorical columns in Lab 2. All types are DOUBLE after encoding.
  features:
    - name: age
      type: double
    - name: job
      type: double
    - name: marital
      type: double
    - name: education
      type: double
    - name: credit_default
      type: double
    - name: housing
      type: double
    - name: loan
      type: double
    - name: contact
      type: double
    - name: month
      type: double
    - name: day_of_week
      type: double
    - name: duration
      type: double
    - name: campaign
      type: double
    - name: pdays
      type: double
    - name: previous
      type: double
    - name: poutcome
      type: double
    - name: emp_var_rate
      type: double
    - name: cons_price_idx
      type: double
    - name: cons_conf_idx
      type: double
    - name: euribor3m
      type: double
    - name: nr_employed
      type: double

  # Lab 2's deterministic 80/20 train/eval split, recorded here to keep this
  # file a true copy of the canonical schema. This pipeline does NOT re-split
  # on it: training_data and evaluation_data arrive already split, and the
  # pipeline only carves a small validation slice out of training_data (see
  # --validation-fraction in the preprocessing step).
  split:
    strategy: deterministic_hash
    train_ratio: 0.8
    hash_column: client_id
