name: BuildSageMakerModel

# Builds and runs the bank-marketing training pipeline.
#
# The pipeline reads the Iceberg tables published by Lab 2
# (bank_marketing.training_data / .evaluation_data), so Lab 2's data-prep
# notebook AND its Iceberg registration notebook must have run before this
# workflow can succeed. The preprocessing step fails with an explicit message if
# either table is empty.
#
# Note there is no dataset-upload step: an earlier version of this workflow
# shipped its own copy of the raw UCI CSV and pushed it to S3 for a Glue table
# that existed only to hold an S3 path. The pipeline now consumes the same
# governed tables as the rest of the workshop.

on:
  push:
    branches:
      - main
    paths:
      - model_build/ml_pipelines/**
      - model_build/source_scripts/**
      - model_build/config/pipeline_config.json
      - model_build/config/dataset_schema.yaml
  workflow_dispatch:

env:
  CONFIG_FILE: model_build/config/pipeline_config.json

jobs:
  Build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo rm -rf /usr/lib/python3/dist-packages/PyJWT-*.dist-info
          pip install --force-reinstall --no-deps PyJWT
          pip install -r model_build/requirements.txt

      - name: Load Configuration
        id: load_config
        run: |
          AWS_REGION=$(jq -r '.aws_region' ${{ env.CONFIG_FILE }})
          SAGEMAKER_PROJECT_NAME=$(jq -r '.sagemaker_project_name' ${{ env.CONFIG_FILE }})
          SAGEMAKER_PIPELINE_ROLE_ARN=$(jq -r '.sagemaker_pipeline_role_arn' ${{ env.CONFIG_FILE }})
          ATHENA_DATABASE=$(jq -r '.athena_database' ${{ env.CONFIG_FILE }})
          TRAINING_TABLE=$(jq -r '.training_table' ${{ env.CONFIG_FILE }})
          EVALUATION_TABLE=$(jq -r '.evaluation_table' ${{ env.CONFIG_FILE }})
          DATA_BUCKET_NAME=$(jq -r '.DataBucketName' ${{ env.CONFIG_FILE }})
          MODEL_PACKAGE_GROUP_NAME=$(jq -r '.model_package_group_name' ${{ env.CONFIG_FILE }})
          MLFLOW_TRACKING_URI=$(jq -r '.mlflow_tracking_uri' ${{ env.CONFIG_FILE }})
          MLFLOW_EXPERIMENT_NAME=$(jq -r '.mlflow_experiment_name' ${{ env.CONFIG_FILE }})
          ACCURACY_THRESHOLD=$(jq -r '.accuracy_threshold // 0.7' ${{ env.CONFIG_FILE }})
          VALIDATION_FRACTION=$(jq -r '.validation_fraction // 0.1' ${{ env.CONFIG_FILE }})

          echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
          echo "sagemaker_project_name=$SAGEMAKER_PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "sagemaker_pipeline_role_arn=$SAGEMAKER_PIPELINE_ROLE_ARN" >> $GITHUB_OUTPUT
          echo "athena_database=$ATHENA_DATABASE" >> $GITHUB_OUTPUT
          echo "training_table=$TRAINING_TABLE" >> $GITHUB_OUTPUT
          echo "evaluation_table=$EVALUATION_TABLE" >> $GITHUB_OUTPUT
          echo "data_bucket_name=$DATA_BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "model_package_group_name=$MODEL_PACKAGE_GROUP_NAME" >> $GITHUB_OUTPUT
          echo "mlflow_tracking_uri=$MLFLOW_TRACKING_URI" >> $GITHUB_OUTPUT
          echo "mlflow_experiment_name=$MLFLOW_EXPERIMENT_NAME" >> $GITHUB_OUTPUT
          echo "accuracy_threshold=$ACCURACY_THRESHOLD" >> $GITHUB_OUTPUT
          echo "validation_fraction=$VALIDATION_FRACTION" >> $GITHUB_OUTPUT

      - name: Validate Configuration
        run: |
          # Fail here rather than 10 minutes into a pipeline run with an opaque error.
          missing=""
          for pair in \
            "sagemaker_project_name=${{ steps.load_config.outputs.sagemaker_project_name }}" \
            "sagemaker_pipeline_role_arn=${{ steps.load_config.outputs.sagemaker_pipeline_role_arn }}" \
            "athena_database=${{ steps.load_config.outputs.athena_database }}" \
            "DataBucketName=${{ steps.load_config.outputs.data_bucket_name }}"; do
            key="${pair%%=*}"
            value="${pair#*=}"
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::pipeline_config.json is missing required values:$missing"
            echo "Fill them in (see the Lab 4A walkthrough) and push again."
            exit 1
          fi
          echo "Configuration looks complete."

      - name: Configure AWS Credentials
        id: aws_creds
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE_GITHUB_WORKFLOW }}
          aws-region: ${{ steps.load_config.outputs.aws_region }}

      - name: Build SageMaker Pipeline
        run: |
          export SAGEMAKER_PROJECT_ID=$(aws sagemaker describe-project \
            --project-name ${{ steps.load_config.outputs.sagemaker_project_name }} \
            --query ProjectId \
            --output text)
          export SAGEMAKER_PROJECT_ARN=$(aws sagemaker describe-project \
            --project-name ${{ steps.load_config.outputs.sagemaker_project_name }} \
            --query ProjectArn \
            --output text)
          export ARTIFACT_BUCKET=sagemaker-project-github-$SAGEMAKER_PROJECT_ID-${{ steps.load_config.outputs.aws_region }}
          export SAGEMAKER_PROJECT_NAME_ID="${{ steps.load_config.outputs.sagemaker_project_name }}-$SAGEMAKER_PROJECT_ID"

          # Use the configured model package group name, else derive one from the project.
          export MODEL_PACKAGE_GROUP_NAME="${{ steps.load_config.outputs.model_package_group_name }}"
          if [ -z "$MODEL_PACKAGE_GROUP_NAME" ] || [ "$MODEL_PACKAGE_GROUP_NAME" = "null" ]; then
            MODEL_PACKAGE_GROUP_NAME="${SAGEMAKER_PROJECT_NAME_ID}"
          fi
          export SAGEMAKER_PIPELINE_ROLE_ARN=${{ steps.load_config.outputs.sagemaker_pipeline_role_arn }}
          export PYTHONPATH="${PYTHONPATH}:${PWD}/model_build"

          cd model_build

          # ARTIFACT_BUCKET holds pipeline-managed outputs; the data bucket holds
          # baseline.json, because that is what Lab 5's monitoring reads.
          KWARGS="{\"region\":\"${{ steps.load_config.outputs.aws_region }}\""
          KWARGS="${KWARGS},\"sagemaker_project_arn\":\"${SAGEMAKER_PROJECT_ARN}\""
          KWARGS="${KWARGS},\"role\":\"${SAGEMAKER_PIPELINE_ROLE_ARN}\""
          KWARGS="${KWARGS},\"default_bucket\":\"${ARTIFACT_BUCKET}\""
          KWARGS="${KWARGS},\"data_bucket\":\"${{ steps.load_config.outputs.data_bucket_name }}\""
          KWARGS="${KWARGS},\"pipeline_name\":\"${SAGEMAKER_PROJECT_NAME_ID}\""
          KWARGS="${KWARGS},\"model_package_group_name\":\"${MODEL_PACKAGE_GROUP_NAME}\""
          KWARGS="${KWARGS},\"base_job_prefix\":\"${SAGEMAKER_PROJECT_NAME_ID}\""
          KWARGS="${KWARGS},\"athena_database\":\"${{ steps.load_config.outputs.athena_database }}\""
          KWARGS="${KWARGS},\"training_table\":\"${{ steps.load_config.outputs.training_table }}\""
          KWARGS="${KWARGS},\"evaluation_table\":\"${{ steps.load_config.outputs.evaluation_table }}\""
          KWARGS="${KWARGS},\"accuracy_threshold\":${{ steps.load_config.outputs.accuracy_threshold }}"
          KWARGS="${KWARGS},\"validation_fraction\":${{ steps.load_config.outputs.validation_fraction }}"
          # Recorded in baseline.json so a drift verdict can be traced to the
          # exact commit that produced the model.
          KWARGS="${KWARGS},\"code_commit_sha\":\"${GITHUB_SHA}\""

          MLFLOW_URI="${{ steps.load_config.outputs.mlflow_tracking_uri }}"
          MLFLOW_EXP="${{ steps.load_config.outputs.mlflow_experiment_name }}"
          if [ -n "$MLFLOW_URI" ] && [ "$MLFLOW_URI" != "null" ]; then
            KWARGS="${KWARGS},\"mlflow_tracking_uri\":\"$MLFLOW_URI\""
          fi
          if [ -n "$MLFLOW_EXP" ] && [ "$MLFLOW_EXP" != "null" ]; then
            KWARGS="${KWARGS},\"mlflow_experiment_name\":\"$MLFLOW_EXP\""
          fi
          KWARGS="${KWARGS}}"

          python ml_pipelines/run_pipeline.py \
            --module-name training.pipeline \
            --role-arn ${SAGEMAKER_PIPELINE_ROLE_ARN} \
            --tags "[{\"Key\":\"sagemaker:project-name\", \"Value\":\"${{ steps.load_config.outputs.sagemaker_project_name }}\"}, {\"Key\":\"sagemaker:project-id\", \"Value\":\"${SAGEMAKER_PROJECT_ID}\"}]" \
            --kwargs "${KWARGS}"
