# This workflow gets the approved model from the model registry and deploys its
# endpoint. The repository holds one folder per model under models/, so the
# workflow first works out which model it is being asked to deploy.

name: Sagemaker Model Deploy Pipeline
run-name: ${{ github.actor }} is deploying a new model to SageMaker

on:
  push:
    branches:
      - main
    paths:
      - models/*/config/deploy_config.json
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Folder name under models/ to deploy. Sent by the project Lambda.'
        required: false
        type: string
      model_package_group_name:
        description: 'Model Package Group Name'
        required: false
        type: string
      model_package_arn:
        description: 'Model Package ARN'
        required: false
        type: string
      logLevel:
        description: 'Log level'
        required: false
        default: 'warning'
        type: choice
        options:
          - info
          - warning
          - debug

permissions:
  id-token: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.pick.outputs.models }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which model to deploy
        id: pick
        env:
          MODEL_NAME_INPUT: ${{ inputs.model_name }}
          MPG_INPUT: ${{ inputs.model_package_group_name }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          THIS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          MODEL=""
          if [ -n "${MODEL_NAME_INPUT:-}" ]; then
            MODEL="$MODEL_NAME_INPUT"
          elif [ -n "${MPG_INPUT:-}" ]; then
            # Older callers only send the model package group. The project
            # template names it <model-name>-model-group, so strip the suffix.
            MODEL="${MPG_INPUT%-model-group}"
          fi

          if [ -n "$MODEL" ]; then
            if [ ! -d "models/${MODEL}" ]; then
              echo "models/${MODEL} does not exist in this repository"
              exit 1
            fi
            MODELS=$(jq -nc --arg m "$MODEL" '[$m]')
          else
            # Pushed change with no inputs: deploy whatever model folders moved.
            if [ -z "${BEFORE_SHA:-}" ] \
               || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              CHANGED=$(git show --name-only --pretty=format: "$THIS_SHA")
            else
              CHANGED=$(git diff --name-only "$BEFORE_SHA" "$THIS_SHA")
            fi
            MODELS=$(printf '%s\n' "$CHANGED" \
              | sed -n 's|^models/\([^/]*\)/.*|\1|p' \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi

          # Someone clicked Run workflow and expects a deployment. Skipping
          # silently would look like success, so fail and say what to do instead.
          if [ "$MODELS" = "[]" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::Nothing to deploy: the latest commit did not change any folder under models/. Run the workflow again and fill in model_name with the model folder, for example bank-classification."
            exit 1
          fi

          echo "models=$MODELS" >> "$GITHUB_OUTPUT"
          echo "Models to deploy: $MODELS"

  GitHub-Actions-Deploy:
    needs: detect
    if: needs.detect.outputs.models != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.detect.outputs.models) }}

    concurrency:
      group: deploy-${{ matrix.model }}
      cancel-in-progress: false

    env:
      MODEL_DIR: models/${{ matrix.model }}
      CONFIG_FILE: models/${{ matrix.model }}/config/deploy_config.json

    steps:
    - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
    - run: echo "This job is now running on a ${{ runner.os }} server hosted by GitHub!"
    - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
    - env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: echo "The commit message for the event - $COMMIT_MSG"
    - uses: actions/checkout@v4
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Load Configuration
      id: load_config
      run: |
        AWS_REGION=$(jq -r '.aws_region' ${{ env.CONFIG_FILE }})
        DEPLOY_ACCOUNT=$(jq -r '.deploy_account' ${{ env.CONFIG_FILE }})
        MODEL_PACKAGE_GROUP_NAME=$(jq -r '.model_package_group_name' ${{ env.CONFIG_FILE }})
        DATA_BUCKET_NAME=$(jq -r '.DataBucketName' ${{ env.CONFIG_FILE }})

        echo "aws_region=$AWS_REGION" >> $GITHUB_OUTPUT
        echo "deploy_account=$DEPLOY_ACCOUNT" >> $GITHUB_OUTPUT
        echo "model_package_group_name=$MODEL_PACKAGE_GROUP_NAME" >> $GITHUB_OUTPUT
        echo "data_bucket_name=$DATA_BUCKET_NAME" >> $GITHUB_OUTPUT

    - name: Configure Dev Account AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
          role-to-assume: ${{secrets.OIDC_ROLE_GITHUB_WORKFLOW}}
          aws-region: ${{ steps.load_config.outputs.aws_region }}

    - name: Install dependencies
      working-directory: ${{ env.MODEL_DIR }}
      run: |
        sh install-prerequisites-brew.sh
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: CDK Synth
      working-directory: ${{ env.MODEL_DIR }}
      run: |
        cdk synth --no-lookups

    - name: Check and Create Bootstrap
      working-directory: ${{ env.MODEL_DIR }}
      env:
        AWS_REGION: ${{ steps.load_config.outputs.aws_region }}
        DEPLOY_ACCOUNT: ${{ steps.load_config.outputs.deploy_account }}
        OIDC_ROLE_GITHUB_WORKFLOW: ${{secrets.OIDC_ROLE_GITHUB_WORKFLOW}}
        CDK_QUALIFIER: "gitactions"
      run: |
        # Validate ARN format
        if [[ ! "${OIDC_ROLE_GITHUB_WORKFLOW}" =~ ^arn:aws:iam::[0-9]{12}:role/ ]]; then
          echo "Error: OIDC_ROLE_GITHUB_WORKFLOW must be a valid IAM role ARN"
          exit 1
        fi
        
        STACK_EXISTS=$(aws cloudformation list-stacks \
          --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE \
          --query "StackSummaries[?StackName=='CDKToolkit-${CDK_QUALIFIER}'].StackName" \
          --output text) || true
        
        if [ ! -z "$STACK_EXISTS" ]; then
          echo "Bootstrap stack CDKToolkit-${CDK_QUALIFIER} already exists, proceeding with deployment..."
        else
          echo "Bootstrap stack CDKToolkit-${CDK_QUALIFIER} not found, creating new stack..."
          cdk bootstrap aws://${DEPLOY_ACCOUNT}/${AWS_REGION} \
            --toolkit-stack-name CDKToolkit-${CDK_QUALIFIER} \
            --qualifier ${CDK_QUALIFIER} \
            --trust ${DEPLOY_ACCOUNT} \
            --cloudformation-execution-policies arn:aws:iam::aws:policy/AdministratorAccess 
        fi
          
    - name: CDK Deploy
      working-directory: ${{ env.MODEL_DIR }}
      env:
        CDK_QUALIFIER: "gitactions"
      run: |
        cdk deploy \
          --require-approval never \
          --toolkit-stack-name CDKToolkit-${CDK_QUALIFIER} \
          --context "@aws-cdk/core:bootstrapQualifier=${CDK_QUALIFIER}" \
          --verbose

  
    - name: CDK list
      working-directory: ${{ env.MODEL_DIR }}
      run: |
        cdk list 
    - run: echo "This github action job's status is ${{ job.status }}."