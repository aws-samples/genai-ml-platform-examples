AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3-based MLOps template for classification models. Adds one folder per model to a shared model-build and model-deploy repository, using SageMaker, GitHub Actions and Iceberg/Athena integration'

Parameters:
  SageMakerProjectName:
    Type: String
    Description: Name of the project
    MinLength: 1
    MaxLength: 32
    AllowedPattern: ^[a-zA-Z](-*[a-zA-Z0-9])*

  SageMakerProjectId:
    Type: String
    Description: Service generated ID of the project

  ModelName:
    Type: String
    Description: >-
      Name of the model this project builds. Used as the folder name under
      models/ in both shared repos, and as the prefix of the model package group.
    Default: bank-classification
    MinLength: 1
    MaxLength: 48
    AllowedPattern: ^[a-z0-9]+(-[a-z0-9]+)*$
    ConstraintDescription: lowercase letters, numbers and single hyphens only

  SeedCodeKind:
    Type: String
    Description: >-
      Which starter code to copy into this model's folder. Each value matches a
      folder under seed-code/, so a future kind of model needs no template
      change here - only a new seed-code folder and zip.
    Default: classification
    AllowedValues:
      - classification

  ModelBuildCodeRepositoryFullname:
    Type: String
    MaxLength: 1024
    Description: Full repository name of the shared model-build repo (format owner/repo-name)
    Default: your-github-username/model-build-repo

  ModelDeployCodeRepositoryFullname:
    Type: String
    MaxLength: 1024
    Description: Full repository name of the shared model-deploy repo (format owner/repo-name)
    Default: your-github-username/model-deploy-repo

  CodeConnectionArn:
    Type: String
    Description: CodeConnections ARN for GitHub authentication

  GitHubWorkflowNameForDeployment:
    Type: String
    MaxLength: 1024
    Default: deploy.yml
    Description: GitHub workflow file name for deployment

  SeedCodeBucketName:
    Type: String
    Description: S3 bucket name where seed code resides (classification-model-repo.zip)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Project Information"
        Parameters:
          - SageMakerProjectName
          - SageMakerProjectId
          - ModelName
          - SeedCodeKind
      - Label:
          default: "GitHub Repository Configuration"
        Parameters:
          - ModelBuildCodeRepositoryFullname
          - ModelDeployCodeRepositoryFullname
          - CodeConnectionArn
          - GitHubWorkflowNameForDeployment
      - Label:
          default: "Seed Code Configuration"
        Parameters:
          - SeedCodeBucketName

Resources:
  MlOpsArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub sagemaker-project-${SageMakerProjectId}

  ModelDeployLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !Join 
        - ':'
        - - 'arn'
          - !Ref 'AWS::Partition'
          - 'iam:'
          - !Ref 'AWS::AccountId'
          - 'role/service-role/AmazonSageMakerServiceCatalogProductsLambdaRole'
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import urllib.request
          import urllib.error

          def lambda_handler(event, context):
              print(f"Received event: {json.dumps(event)}")
              
              repo_fullname = os.environ['GITHUB_REPO_FULLNAME']
              workflow_name = os.environ['GITHUB_WORKFLOW_NAME']
              # The deploy repo holds one folder per model. Tell the workflow
              # which folder to deploy rather than making it guess.
              model_name = os.environ['MODEL_NAME']
              repo_owner, repo_name = repo_fullname.split('/', 1)
              
              # Get PAT from Secrets Manager
              secrets = boto3.client('secretsmanager')
              try:
                  response = secrets.get_secret_value(SecretId='github/pat-for-workflow-trigger')
                  github_token = response['SecretString']
              except Exception as e:
                  print(f"Error retrieving GitHub token: {e}")
                  raise
              
              # Trigger GitHub Actions workflow
              url = f"https://api.github.com/repos/{repo_owner}/{repo_name}/actions/workflows/{workflow_name}/dispatches"
              
              data = json.dumps({
                  "ref": "main",
                  "inputs": {
                      "model_name": model_name,
                      "model_package_group_name": event.get('detail', {}).get('ModelPackageGroupName', ''),
                      "model_package_arn": event.get('detail', {}).get('ModelPackageArn', '')
                  }
              }).encode('utf-8')
              
              headers = {
                  'Authorization': f'token {github_token}',
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
              }
              
              req = urllib.request.Request(url, data=data, headers=headers, method='POST')
              
              try:
                  with urllib.request.urlopen(req) as response:
                      print(f"GitHub Actions workflow triggered successfully: {response.status}")
                      return {
                          'statusCode': 200,
                          'body': json.dumps('Workflow triggered successfully')
                      }
              except urllib.error.HTTPError as e:
                  error_body = e.read().decode()
                  print(f"Error triggering workflow: {e.code} - {error_body}")
                  raise e
      Environment:
        Variables:
          GITHUB_REPO_FULLNAME: !Ref ModelDeployCodeRepositoryFullname
          GITHUB_WORKFLOW_NAME: !Ref GitHubWorkflowNameForDeployment
          MODEL_NAME: !Ref ModelName

  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ModelDeployLambda.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ModelApprovalEventRule.Arn

  ModelApprovalEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${SageMakerProjectName}-model-approval
      Description: Trigger deployment when model is approved
      EventPattern:
        source:
          - aws.sagemaker
        detail-type:
          - SageMaker Model Package State Change
        detail:
          ModelPackageGroupName:
            - !Sub ${ModelName}-model-group
          ModelApprovalStatus:
            - Approved
      State: ENABLED
      Targets:
        - Arn: !GetAtt ModelDeployLambda.Arn
          Id: ModelDeploymentTarget

  SageMakerCodeRepository:
    Type: AWS::SageMaker::CodeRepository
    Properties:
      CodeRepositoryName: !Sub sagemaker-${SageMakerProjectId}-modelbuild
      GitConfig:
        RepositoryUrl: !Sub https://github.com/${ModelBuildCodeRepositoryFullname}

  SageMakerDeployCodeRepository:
    Type: AWS::SageMaker::CodeRepository
    Properties:
      CodeRepositoryName: !Sub sagemaker-${SageMakerProjectId}-modeldeploy
      GitConfig:
        RepositoryUrl: !Sub https://github.com/${ModelDeployCodeRepositoryFullname}

  # Seed Code Automation
  GitSeedCodeCheckinProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub sagemaker-${SageMakerProjectName}-${SageMakerProjectId}-git-seedcodecheckin
      Description: Checkin the initial seedcode into the given repository
      ServiceRole: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/service-role/AmazonSageMakerServiceCatalogProductsCodeBuildRole
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: SeedCodeBucket
            Value: !Ref SeedCodeBucketName
          - Name: SourceModelBuildCodeRepositoryBranch
            Value: main
          - Name: SourceModelDeployCodeRepositoryBranch
            Value: main
          - Name: SourceModelBuildCodeRepositoryFullname
            Value: !Ref ModelBuildCodeRepositoryFullname
          - Name: SourceModelDeployCodeRepositoryFullname
            Value: !Ref ModelDeployCodeRepositoryFullname
          - Name: CodestarConnectionArn
            Value: !Ref CodeConnectionArn
          - Name: MODEL_NAME
            Value: !Ref ModelName
          - Name: MODEL_PACKAGE_GROUP_NAME
            Value: !Sub ${ModelName}-model-group
      Source:
        Type: S3
        Location: !Sub sagemaker-servicecatalog-seedcode-${AWS::Region}/bootstrap/GitRepositorySeedCodeCheckinCodeBuildProject-v1.1.zip
        # The buildspec that ships in the bucket above starts a fresh history with
        # `git init`, which only works against an empty repository. These repos are
        # shared by every model, so we clone what is already there and add one
        # folder instead. GIT_REPOSITORY_URL and SEED_SUBFOLDER are supplied per
        # build by GitSeedCodeCheckinProjectTriggerLambda.
        BuildSpec: |
          version: 0.2

          phases:
            install:
              commands:
                - git config --global credential.helper '!aws codecommit credential-helper $@'
                - git config --global credential.UseHttpPath true
                - git config --global user.email "noreply-aws@amazon.com"
                - git config --global user.name "AWS-Sagemaker"
            build:
              commands:
                - echo "Adding models/$MODEL_NAME from $SEED_SUBFOLDER to $GIT_REPOSITORY_URL"
                - git clone --quiet $GIT_REPOSITORY_URL /tmp/monorepo
                - cd /tmp/monorepo
                # A newly created repo has no commits, so there is no branch to check
                # out yet. Point HEAD at the branch name instead of creating it.
                - git checkout "$GIT_REPOSITORY_BRANCH" 2>/dev/null || git symbolic-ref HEAD "refs/heads/$GIT_REPOSITORY_BRANCH"
                - |
                  if [ -d "models/$MODEL_NAME" ]; then
                    echo "models/$MODEL_NAME already exists in this repo - refusing to overwrite it"
                    exit 1
                  fi
                - mkdir -p "models/$MODEL_NAME"
                - cp -r $CODEBUILD_SRC_DIR_source/$SEED_SUBFOLDER/. "models/$MODEL_NAME/"
                - |
                  # The seed code ships with a placeholder model package group name.
                  # Replace it so the pipeline registers into the group this project watches.
                  for f in "models/$MODEL_NAME/config/pipeline_config.json" \
                           "models/$MODEL_NAME/config/deploy_config.json"; do
                    if [ -f "$f" ]; then
                      sed -i "s|\"model_package_group_name\": *\"[^\"]*\"|\"model_package_group_name\": \"$MODEL_PACKAGE_GROUP_NAME\"|" "$f"
                      echo "set model_package_group_name in $f"
                    fi
                  done
                - git add "models/$MODEL_NAME"
                - git commit -m "Add seed code for model $MODEL_NAME"
                - |
                  # Two projects created at the same time both push to this branch.
                  # Whoever loses the race rebases and tries again.
                  for attempt in 1 2 3 4 5; do
                    if git push origin "$GIT_REPOSITORY_BRANCH"; then
                      echo "pushed models/$MODEL_NAME on attempt $attempt"
                      exit 0
                    fi
                    echo "push rejected, rebasing and retrying (attempt $attempt)"
                    git pull --rebase origin "$GIT_REPOSITORY_BRANCH" || true
                    sleep $((attempt * 3))
                  done
                  echo "could not push models/$MODEL_NAME after 5 attempts"
                  exit 1
      TimeoutInMinutes: 14

  GitSeedCodeCheckinProjectTriggerLambda:
    DependsOn: GitSeedCodeCheckinProject
    Type: AWS::Lambda::Function
    Properties:
      Description: Trigger CodeBuild project for seedcode checkin
      Handler: index.lambda_handler
      Runtime: python3.12
      FunctionName: !Sub sagemaker-${SageMakerProjectId}-git-seedcodecheckin
      Timeout: 900
      Role: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/service-role/AmazonSageMakerServiceCatalogProductsLambdaRole
      Environment:
        Variables:
          MODEL_BUILD_REPO: !Ref ModelBuildCodeRepositoryFullname
          MODEL_DEPLOY_REPO: !Ref ModelDeployCodeRepositoryFullname
          CODE_CONNECTION_ARN: !Ref CodeConnectionArn
          SEED_CODE_BUCKET: !Ref SeedCodeBucketName
          SEED_BUILD_ZIP: !Sub ${SeedCodeKind}-model-build-repo.zip
          SEED_DEPLOY_ZIP: !Sub ${SeedCodeKind}-model-deploy-repo.zip
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time
          import os
          from botocore.exceptions import ClientError

          def lambda_handler(event, context):
            responseData = {}
            if event['RequestType'] == 'Create':
              try:
                time.sleep(20)
                print("Starting seed code checkin")
                client = boto3.client('codebuild')
                
                # Parse connection ARN
                connection_arn = os.environ['CODE_CONNECTION_ARN']
                arn_parts = connection_arn.split(':')
                region = arn_parts[3]
                account = arn_parts[4]
                connection_id = arn_parts[5].split('/')[-1]
                
                # Get connection URL prefix
                url_prefix = 'codestar-connections' if 'codestar-connections' in connection_arn else 'codeconnections'
                
                # Start build for model-build repo
                build_repo_url = f'https://{url_prefix}.{region}.amazonaws.com/git-http/{account}/{region}/{connection_id}/{os.environ["MODEL_BUILD_REPO"]}.git'
                response = client.start_build(
                  projectName=event['ResourceProperties']['ProjectName'],
                  environmentVariablesOverride=[
                    {'name': 'GIT_REPOSITORY_BRANCH', 'value': 'main', 'type': 'PLAINTEXT'},
                    {'name': 'GIT_REPOSITORY_URL', 'value': build_repo_url, 'type': 'PLAINTEXT'},
                    {'name': 'SEED_SUBFOLDER', 'value': 'model_build', 'type': 'PLAINTEXT'}
                  ],
                  secondarySourcesOverride=[
                    {
                      'location': f'{os.environ["SEED_CODE_BUCKET"]}/{os.environ["SEED_BUILD_ZIP"]}',
                      'type': 'S3',
                      'sourceIdentifier': 'source'
                    }
                  ]
                )
                print(f"Build repo CodeBuild started: {response['build']['id']}")
                
                # Start build for model-deploy repo
                deploy_repo_url = f'https://{url_prefix}.{region}.amazonaws.com/git-http/{account}/{region}/{connection_id}/{os.environ["MODEL_DEPLOY_REPO"]}.git'
                response2 = client.start_build(
                  projectName=event['ResourceProperties']['ProjectName'],
                  environmentVariablesOverride=[
                    {'name': 'GIT_REPOSITORY_BRANCH', 'value': 'main', 'type': 'PLAINTEXT'},
                    {'name': 'GIT_REPOSITORY_URL', 'value': deploy_repo_url, 'type': 'PLAINTEXT'},
                    {'name': 'SEED_SUBFOLDER', 'value': 'model_deploy', 'type': 'PLAINTEXT'}
                  ],
                  secondarySourcesOverride=[
                    {
                      'location': f'{os.environ["SEED_CODE_BUCKET"]}/{os.environ["SEED_DEPLOY_ZIP"]}',
                      'type': 'S3',
                      'sourceIdentifier': 'source'
                    }
                  ]
                )
                print(f"Deploy repo CodeBuild started: {response2['build']['id']}")
                
                responseData['BuildId'] = response['build']['id']
                responseData['DeployBuildId'] = response2['build']['id']
                cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
              except ClientError as e:
                print(f"Error: {e}")
                cfnresponse.send(event, context, cfnresponse.FAILED, responseData)
            else:
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)

  TriggerGitSeedCodeCheckin:
    Type: Custom::TriggerLambda
    DependsOn: GitSeedCodeCheckinProjectTriggerLambda
    Properties:
      ServiceToken: !GetAtt GitSeedCodeCheckinProjectTriggerLambda.Arn
      ProjectName: !Ref GitSeedCodeCheckinProject

Outputs:
  ArtifactBucket:
    Description: S3 bucket for ML artifacts
    Value: !Ref MlOpsArtifactsBucket

  LambdaFunctionArn:
    Description: Lambda function ARN for GitHub workflow trigger
    Value: !GetAtt ModelDeployLambda.Arn

  EventRuleArn:
    Description: EventBridge rule ARN
    Value: !GetAtt ModelApprovalEventRule.Arn

  CodeRepositoryName:
    Description: SageMaker model build code repository name
    Value: !GetAtt SageMakerCodeRepository.CodeRepositoryName

  DeployCodeRepositoryName:
    Description: SageMaker model deploy code repository name
    Value: !GetAtt SageMakerDeployCodeRepository.CodeRepositoryName

  ModelPackageGroupName:
    Description: >-
      Model package group this project watches for approvals. The seeded
      pipeline_config.json and deploy_config.json are already set to it.
    Value: !Sub ${ModelName}-model-group

  ModelFolder:
    Description: Folder added to both shared repos for this model
    Value: !Sub models/${ModelName}

  SeedCodeKindUsed:
    Description: Starter code copied into that folder
    Value: !Ref SeedCodeKind