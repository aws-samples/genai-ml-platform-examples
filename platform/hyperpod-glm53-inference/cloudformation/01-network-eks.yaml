AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  Stack 1 of 3. Network and EKS control plane for serving GLM-5.3 on SageMaker
  HyperPod. Creates its own VPC, so deploying and deleting this stack cannot affect
  any other workload in the account.

  Differences from a CPU-only HyperPod network: /20 private subnets, because each
  ml.p5en.48xlarge attaches many EFA network interfaces and each takes an address;
  load balancer subnet tags for the AWS Load Balancer Controller that the HyperPod
  Inference add-on installs; and an IAM OIDC provider, because the inference
  operator, KEDA, the load balancer controller and the Inference Gateway all use
  IAM roles for service accounts (IRSA).

  After this stack completes you MUST install the HyperPod Helm chart before
  deploying stack 3. The HelmCommands output prints what to run.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Networking
        Parameters:
          - VpcCidr
      - Label:
          default: EKS
        Parameters:
          - KubernetesVersion
          - ClusterAdminPrincipalArn
          - ExtraPrivateSubnetAzId

Parameters:
  VpcCidr:
    Type: String
    Default: 10.43.0.0/16
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])/16$'
    ConstraintDescription: Must be a /16.
    Description: >-
      CIDR for the new VPC, which must be a /16. It is carved into /20 blocks: the
      first holds a /24 public subnet for the NAT gateway, the next two are the
      private subnets for the cluster.

  KubernetesVersion:
    Type: String
    Default: '1.33'
    AllowedValues: ['1.31', '1.32', '1.33', '1.34', '1.35']
    Description: Kubernetes version for the EKS control plane.

  ClusterAdminPrincipalArn:
    Type: String
    MinLength: 1
    Description: >-
      REQUIRED. ARN of the IAM role or user that will run kubectl and Helm. Use the
      role ARN, not the assumed-role ARN that "sts get-caller-identity" returns. This
      stack grants cluster admin only through this access entry, so the outcome does
      not depend on which principal deploys it.

  ExtraPrivateSubnetAzId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9]+-az[0-9]+$'
    Description: >-
      Optional Availability Zone ID (for example usw2-az3) for a third private subnet.
      Use it when GPU capacity is short in the first two zones; stack 3 can add it to
      the GPU instance group's subnets with GpuSubnetIds. Zone IDs, unlike zone names, mean
      the same zone in every account.

Conditions:
  HasExtraPrivateSubnet: !Not [!Equals [!Ref ExtraPrivateSubnetAzId, '']]

Resources:

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------------------------------------------------------------------------
  # Subnets. The VPC is split into sixteen /20s. Block 0 holds a /24 public
  # subnet for the NAT gateway; blocks 1 and 2 are the private subnets, which
  # HyperPod requires. A /20 gives about 4,000 addresses per subnet, enough for
  # several EFA-heavy GPU nodes plus pod IPs.
  # ---------------------------------------------------------------------------
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Select [0, !Cidr [!Ref VpcCidr, 16, 12]], 16, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public'
        - Key: kubernetes.io/role/elb
          Value: '1'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-1'
        - Key: kubernetes.io/role/internal-elb
          Value: '1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-2'
        - Key: kubernetes.io/role/internal-elb
          Value: '1'

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Condition: HasExtraPrivateSubnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZoneId: !Ref ExtraPrivateSubnetAzId
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-3'
        - Key: kubernetes.io/role/internal-elb
          Value: '1'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat-eip'

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-nat'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # The NAT gateway stays in the first zone, so internet traffic from this subnet
  # (container images from public registries, Hugging Face) crosses zones to reach
  # it, at the usual inter-zone data rate. Model weights in S3 use the S3 gateway
  # endpoint, which this route table shares.
  PrivateSubnet3RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasExtraPrivateSubnet
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # S3 gateway endpoint. Free. Loading the 756 GB GLM-5.3 checkpoint from S3 and
  # pulling ECR image layers both go through it instead of the NAT gateway, which
  # charges per GB.
  # ---------------------------------------------------------------------------
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ---------------------------------------------------------------------------
  # One security group for the EKS control plane ENIs and every HyperPod node.
  # The all-traffic self-referencing rule covers node to control plane traffic
  # and is also what EFA requires between GPU nodes.
  # ---------------------------------------------------------------------------
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HyperPod and EKS intra-cluster traffic, including EFA.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Outbound to AWS APIs and public registries.
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-cluster-sg'

  ClusterSecurityGroupSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref ClusterSecurityGroup
      Description: All traffic between members of this group. Required for EFA.

  # EFA also requires a self-referencing egress rule, not only ingress.
  ClusterSecurityGroupSelfEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ClusterSecurityGroup
      IpProtocol: '-1'
      DestinationSecurityGroupId: !Ref ClusterSecurityGroup
      Description: All traffic to members of this group. Required for EFA.

  # ---------------------------------------------------------------------------
  # EKS control plane. HyperPod supplies the nodes.
  # ---------------------------------------------------------------------------
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy'

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub '${AWS::StackName}-eks'
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref ClusterSecurityGroup
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: false

  ClusterAdmin:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EksCluster
      PrincipalArn: !Ref ClusterAdminPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: !Sub 'arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy'
          AccessScope:
            Type: cluster

  # ---------------------------------------------------------------------------
  # IAM OIDC provider for IRSA. The HyperPod Inference add-on's components
  # (inference operator, KEDA, load balancer controller, Inference Gateway)
  # authenticate to AWS through IRSA rather than EKS Pod Identity.
  # ---------------------------------------------------------------------------
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt EksCluster.OpenIdConnectIssuerUrl
      ClientIdList:
        - sts.amazonaws.com

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub '${AWS::StackName}-vpc-id'

  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-private-subnet-1'

  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-private-subnet-2'

  PrivateSubnet3Id:
    Condition: HasExtraPrivateSubnet
    Description: Add to stack 3's GpuSubnetIds to let the GPU instance group use this zone.
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub '${AWS::StackName}-private-subnet-3'

  ClusterSecurityGroupId:
    Value: !Ref ClusterSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-cluster-sg'

  EksClusterName:
    Value: !Ref EksCluster
    Export:
      Name: !Sub '${AWS::StackName}-eks-cluster-name'

  EksClusterArn:
    Value: !GetAtt EksCluster.Arn
    Export:
      Name: !Sub '${AWS::StackName}-eks-cluster-arn'

  OidcProviderArn:
    Value: !Ref OidcProvider
    Export:
      Name: !Sub '${AWS::StackName}-oidc-provider-arn'

  OidcIssuer:
    Description: The issuer host and path without https://, as used in IRSA trust conditions.
    Value: !Select [1, !Split ['https://', !GetAtt EksCluster.OpenIdConnectIssuerUrl]]
    Export:
      Name: !Sub '${AWS::StackName}-oidc-issuer'

  KubeconfigCommand:
    Value: !Sub 'aws eks update-kubeconfig --name ${EksCluster} --region ${AWS::Region}'

  HelmCommands:
    Description: REQUIRED before stack 3. Installs the HyperPod dependency chart.
    Value: >-
      git clone --depth 1 https://github.com/aws/sagemaker-hyperpod-cli.git /tmp/hyperpod-cli &&
      helm dependencies update /tmp/hyperpod-cli/helm_chart/HyperPodHelmChart &&
      helm install hyperpod-dependencies /tmp/hyperpod-cli/helm_chart/HyperPodHelmChart --namespace kube-system
