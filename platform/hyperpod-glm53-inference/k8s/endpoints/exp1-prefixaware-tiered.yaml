# Experiment 1: managed tiered KV cache with prefix-aware routing.
#
# L1 keeps KV blocks in each node's CPU memory; L2 shares them across nodes through
# HyperPod managed tiered storage. Prefix-aware routing sends requests that share a
# prompt prefix (the repository context) to the replica that already holds it.
#
# Apply with: envsubst < k8s/endpoints/exp1-prefixaware-tiered.yaml | kubectl apply -f -
# Required variables: NAMESPACE, MODEL_BUCKET, MODEL_PREFIX, AWS_REGION, INSTANCE_TYPE,
# VLLM_IMAGE, NVME_HOST_PATH. See README.md.
apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: glm53-pa
  namespace: ${NAMESPACE}
spec:
  modelName: glm-5.3
  instanceType: ${INSTANCE_TYPE}
  invocationEndpoint: v1/chat/completions
  replicas: 3
  modelSourceConfig:
    modelSourceType: s3
    s3Storage:
      bucketName: ${MODEL_BUCKET}
      region: ${AWS_REGION}
    modelLocation: ${MODEL_PREFIX}
    prefetchEnabled: true
  metrics:
    enabled: true
    modelMetrics:
      port: 8000
  # Weights and image caching are on here only to make switching between arms
  # fast. They do not affect routing, which is what this experiment measures.
  modelCacheConfig:
    weightsCache:
      enabled: true
      hostPath: ${NVME_HOST_PATH}
    imageCache:
      enabled: true
  kvCacheSpec:
    enableL1Cache: true
    enableL2Cache: true
    l2CacheSpec:
      l2CacheBackend: tieredstorage
  intelligentRoutingSpec:
    enabled: true
    routingStrategy: prefixaware
  worker:
    image: ${VLLM_IMAGE}
    modelInvocationPort:
      containerPort: 8000
      name: http
    modelVolumeMount:
      name: model-weights
      mountPath: /opt/ml/model
    resources:
      # One replica uses a whole ml.p5en.48xlarge: 8x H200, tensor-parallel 8.
      requests:
        nvidia.com/gpu: 8
        cpu: "160"
        memory: 1200Gi
      limits:
        nvidia.com/gpu: 8
    # vLLM's GLM-5.3 recipe: FP8 KV cache, MTP speculative decoding, GLM parsers.
    args:
      - "--model"
      - "/opt/ml/model"
      - "--served-model-name"
      - "glm-5.3"
      - "--port"
      - "8000"
      - "--tensor-parallel-size"
      - "8"
      - "--kv-cache-dtype"
      - "fp8"
      - "--max-model-len"
      - "131072"
      - "--speculative-config"
      - '{"method": "mtp", "num_speculative_tokens": 5}'
      - "--tool-call-parser"
      - "glm47"
      - "--reasoning-parser"
      - "glm45"
      - "--enable-auto-tool-choice"
    environmentVariables:
      - name: VLLM_REQUEST_TIMEOUT
        value: "1800"
