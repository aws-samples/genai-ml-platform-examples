# Qwen3-0.6B variant: a small-model rehearsal of the GLM-5.3 arm in ../exp3-cache-off.yaml.
# Only the name, model, resources and vLLM arguments differ.
#
# Experiment 3, baseline: no model or image caching.
#
# Starts with 2 replicas. loadgen/scaleout_timer.py adds a third and times how long the
# new replica takes to serve. Without caching, the new pod pulls the vLLM image and
# downloads all 756 GB of weights from S3 first.
#
# Apply with: envsubst < k8s/endpoints/qwen3-0.6b/exp3-cache-off.yaml | kubectl apply -f -
# Required variables: NAMESPACE, MODEL_BUCKET, MODEL_PREFIX (Qwen/Qwen3-0.6B), AWS_REGION, INSTANCE_TYPE,
# VLLM_IMAGE. See README.md.
apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: qwen06-cold
  namespace: ${NAMESPACE}
spec:
  modelName: qwen3-0.6b
  instanceType: ${INSTANCE_TYPE}
  invocationEndpoint: v1/chat/completions
  replicas: 2
  modelSourceConfig:
    modelSourceType: s3
    s3Storage:
      bucketName: ${MODEL_BUCKET}
      region: ${AWS_REGION}
    modelLocation: ${MODEL_PREFIX}
    prefetchEnabled: true
  metrics:
    enabled: true
    modelMetrics:
      port: 8000
  worker:
    image: ${VLLM_IMAGE}
    modelInvocationPort:
      containerPort: 8000
      name: http
    modelVolumeMount:
      name: model-weights
      mountPath: /opt/ml/model
    resources:
      # One replica per A10G GPU (24 GB). Sized so four replicas share one
      # ml.g5.12xlarge (4 GPUs, 24 vCPUs with ThreadsPerCore 1, 192 GB) alongside
      # the 20% of memory that managed tiered storage takes. Requests also fit one
      # replica per ml.g5.8xlarge.
      requests:
        nvidia.com/gpu: 1
        cpu: "4"
        memory: 32Gi
      limits:
        nvidia.com/gpu: 1
    # Qwen3-0.6B fits one GPU, so no tensor parallelism. --max-model-len matches the
    # model's 40,960-token context, which the 32k-token coding context fits under.
    args:
      - "--model"
      - "/opt/ml/model"
      - "--served-model-name"
      - "qwen3-0.6b"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "40960"
      - "--reasoning-parser"
      - "qwen3"
    environmentVariables:
      - name: VLLM_REQUEST_TIMEOUT
        value: "1800"
