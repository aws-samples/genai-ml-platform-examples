# Qwen3-0.6B variant: a small-model rehearsal of the GLM-5.3 arm in ../exp1-prefixaware-tiered.yaml.
# Only the name, model, resources and vLLM arguments differ.
#
# Experiment 1: managed tiered KV cache with prefix-aware routing.
#
# L1 keeps KV blocks in each node's CPU memory; L2 shares them across nodes through
# HyperPod managed tiered storage. Prefix-aware routing sends requests that share a
# prompt prefix (the repository context) to the replica that already holds it.
#
# Apply with: envsubst < k8s/endpoints/qwen3-0.6b/exp1-prefixaware-tiered.yaml | kubectl apply -f -
# Required variables: NAMESPACE, MODEL_BUCKET, MODEL_PREFIX (Qwen/Qwen3-0.6B), AWS_REGION, INSTANCE_TYPE,
# VLLM_IMAGE, NVME_HOST_PATH. See README.md.
apiVersion: inference.sagemaker.aws.amazon.com/v1
kind: InferenceEndpointConfig
metadata:
  name: qwen06-pa
  namespace: ${NAMESPACE}
spec:
  modelName: qwen3-0.6b
  instanceType: ${INSTANCE_TYPE}
  invocationEndpoint: v1/chat/completions
  replicas: 3
  modelSourceConfig:
    modelSourceType: s3
    s3Storage:
      bucketName: ${MODEL_BUCKET}
      region: ${AWS_REGION}
    modelLocation: ${MODEL_PREFIX}
    prefetchEnabled: true
  metrics:
    enabled: true
    modelMetrics:
      port: 8000
  # Weights and image caching are on here only to make switching between arms
  # fast. They do not affect routing, which is what this experiment measures.
  modelCacheConfig:
    weightsCache:
      enabled: true
      hostPath: ${NVME_HOST_PATH}
    imageCache:
      enabled: true
  kvCacheSpec:
    enableL1Cache: true
    enableL2Cache: true
    l2CacheSpec:
      l2CacheBackend: tieredstorage
  intelligentRoutingSpec:
    enabled: true
    routingStrategy: prefixaware
  worker:
    image: ${VLLM_IMAGE}
    modelInvocationPort:
      containerPort: 8000
      name: http
    modelVolumeMount:
      name: model-weights
      mountPath: /opt/ml/model
    resources:
      # One replica per A10G GPU (24 GB). Sized so four replicas share one
      # ml.g5.12xlarge (4 GPUs, 24 vCPUs with ThreadsPerCore 1, 192 GB) alongside
      # the 20% of memory that managed tiered storage takes. Requests also fit one
      # replica per ml.g5.8xlarge.
      requests:
        nvidia.com/gpu: 1
        cpu: "4"
        memory: 32Gi
      limits:
        nvidia.com/gpu: 1
    # Qwen3-0.6B fits one GPU, so no tensor parallelism. --max-model-len matches the
    # model's 40,960-token context, which the 32k-token coding context fits under.
    args:
      - "--model"
      - "/opt/ml/model"
      - "--served-model-name"
      - "qwen3-0.6b"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "40960"
      - "--reasoning-parser"
      - "qwen3"
    environmentVariables:
      - name: VLLM_REQUEST_TIMEOUT
        value: "1800"
